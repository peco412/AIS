<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cộng đồng — AIS Center</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d6ea6" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/parent.css" />
<style>
  .post-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-xs); }
  .post-card__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .post-card__avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .post-card__name { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .post-card__meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .post-card__badge { font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-deep); margin-left: 6px; vertical-align: middle; }
  .post-card__friendbtn { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: none; cursor: pointer; background: var(--accent); color: #fff; }
  .post-card__friendbtn.is-pending { background: var(--surface-fill); color: var(--muted); cursor: default; }
  .post-card__friendbtn.is-friend { background: none; color: var(--muted); font-size: 11px; }

  .post-card__ownmenu { position: relative; flex-shrink: 0; }
  .post-card__ownmenu-btn { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 4px 8px; }
  .post-card__ownmenu-list { position: absolute; top: 100%; right: 0; z-index: 10; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); min-width: 130px; overflow: hidden; }
  .post-card__ownmenu-list button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .post-card__ownmenu-list button:hover { background: var(--surface-fill); }
  .post-edit-textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; font-family: inherit; font-size: 13px; resize: vertical; outline: none; }
  .btn-cancel-edit, .btn-save-edit { border: none; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-cancel-edit { background: var(--surface-fill); color: var(--ink); }
  .btn-save-edit { background: var(--accent); color: #fff; }
  .post-card__caption { padding: 0 16px 10px; font-size: 13.5px; color: var(--ink); line-height: 1.5; white-space: pre-wrap; }
  .post-card__img { width: 100%; max-height: 480px; object-fit: cover; display: block; background: var(--surface-fill); }
  .post-card__actions { display: flex; align-items: center; gap: 16px; padding: 8px 16px 12px; }
  .post-card__actionbtn { display: flex; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 4px; }
  .post-card__actionbtn.is-liked { color: var(--danger); }
  .post-card__actionbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .post-card__actionbtn.is-liked svg { fill: currentColor; }

  .comments-box { border-top: 1px solid var(--border); padding: 10px 16px 12px; display: none; }
  .comments-box.show { display: block; }
  .comment-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .comment-row__avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10px; flex-shrink: 0; }
  .comment-row__bubble { background: var(--surface-fill); border-radius: 12px; padding: 6px 11px; font-size: 12.5px; }
  .comment-row__name { font-weight: 700; font-size: 11.5px; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 6px; }
  .comment-input-row input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; outline: none; background: var(--surface-fill); }
  .comment-input-row button { border: none; background: none; color: var(--accent-deep); font-weight: 700; font-size: 12px; cursor: pointer; padding: 0 6px; }

  .composer { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-xs); }
  .composer textarea { width: 100%; border: none; resize: none; font-family: inherit; font-size: 13.5px; min-height: 44px; outline: none; background: transparent; color: var(--ink); }
  .composer__preview { position: relative; margin-top: 8px; }
  .composer__preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius-md); display: block; }
  .composer__preview button { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; }
  .composer__bar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .composer__photobtn { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent-deep); cursor: pointer; }
  .composer__photobtn input { display: none; }
  .composer__submit { padding: 7px 18px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .composer__submit:disabled { opacity: 0.4; cursor: not-allowed; }

  /* MỚI — lưới xem trước nhiều ảnh/video lúc soạn bài */
  .composer__preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .composer__preview-grid .preview-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-fill); }
  .composer__preview-grid .preview-item img, .composer__preview-grid .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .composer__preview-grid .preview-item button { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; line-height: 1; }

  /* MỚI — lưới nhiều ảnh/video trong bài đã đăng (1 ảnh: full width, 2+: lưới) */
  .post-card__media-grid { display: grid; gap: 2px; }
  .post-card__media-grid.count-1 { grid-template-columns: 1fr; }
  .post-card__media-grid.count-2 { grid-template-columns: 1fr 1fr; }
  .post-card__media-grid.count-3, .post-card__media-grid.count-4 { grid-template-columns: 1fr 1fr; }
  .post-card__media-grid img, .post-card__media-grid video { width: 100%; height: 100%; max-height: 420px; object-fit: cover; display: block; background: var(--surface-fill); }

  /* MỚI — bài chia sẻ lại: khung lồng hiện bài gốc */
  .shared-post-embed { margin: 0 16px 10px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .shared-post-embed__head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .shared-post-embed__avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; }
  .shared-post-embed__name { font-weight: 700; font-size: 12.5px; }
  .shared-post-embed__caption { padding: 0 12px 10px; font-size: 12.5px; color: var(--ink); }
  .shared-post-embed__deleted { padding: 16px; text-align: center; font-size: 12.5px; color: var(--muted); }

  /* MỚI — bình luận trả lời lồng nhau + báo cáo/chặn/menu bài viết */
  .comment-row.is-reply { margin-left: 34px; }
  .comment-row__actions { display: flex; gap: 10px; margin-top: 2px; }
  .comment-row__actions button { background: none; border: none; padding: 0; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .reply-input-row { display: flex; gap: 8px; margin: 4px 0 8px 34px; }
  .reply-input-row input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; outline: none; background: var(--surface-fill); }
  .reply-input-row button { border: none; background: none; color: var(--accent-deep); font-weight: 700; font-size: 11.5px; cursor: pointer; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  .skeleton-post { height: 160px; border-radius: var(--radius-lg); background: var(--surface-fill); margin-bottom: 14px; }
</style>
</head>
<body >

<header class="app-topbar">
  <div class="app-topbar__title">Cộng đồng</div>
  <div class="app-topbar__right">
    <button class="icon-btn" onclick="location.href='notifications-social.html'" id="btnNotifBell" title="Thông báo" style="position:relative;">🔔<span id="notifBadge" style="display:none; position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--danger);"></span></button>
    <button class="icon-btn" onclick="location.href='social-profile.html'" title="Hồ sơ của tôi">👤</button>
    <button class="icon-btn" id="logoutBtn" title="Đăng xuất">⏻</button>
  </div>
</header>

<main class="app-main">
  <div class="composer">
    <textarea id="composerText" placeholder="Chia sẻ khoảnh khắc, thông báo tới cộng đồng..." rows="2"></textarea>
    <div class="composer__preview-grid" id="composerPreviewGrid" style="display:none;"></div>
    <div class="composer__bar">
      <label class="composer__photobtn">
        📷 Thêm ảnh/video
        <input type="file" id="photoInput" accept="image/*,video/*" multiple />
      </label>
      <button class="composer__submit" id="btnPost" disabled>Đăng</button>
    </div>
  </div>

  <div class="search-bar" style="margin: 12px 0;">
    <input type="text" id="postSearchInput" placeholder="🔍 Tìm bài viết theo nội dung..." style="width:100%; padding:10px 14px; border-radius:999px; border:1px solid var(--border); font-size:13.5px;" />
  </div>

  <div id="feedList"><div class="skeleton-post"></div><div class="skeleton-post"></div></div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav__inner">

    <a href="messages.html"><svg class="icon icon--nav" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5a8.5 8.5 0 1 1 17-3z"/></svg>Tin nhắn</a>
    <a href="wallet.html" class="nav-parent-only"><svg class="icon icon--nav" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Ví AIScoins</a>
    <a href="account.html" class="nav-parent-only"><svg class="icon icon--nav" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Tài khoản</a>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="env.js"></script>

</body>
</html>
