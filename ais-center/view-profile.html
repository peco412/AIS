<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hồ sơ — AIS Center</title>
<link rel="stylesheet" href="css/parent.css" />
<style>
  .profile-hero { display: flex; flex-direction: column; align-items: center; padding: 24px 0 16px; }
  .profile-hero__avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .profile-hero__avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-hero__name { font-family: var(--font-display, serif); font-size: 19px; font-weight: 700; margin-top: 12px; }
  .profile-hero__actions { display: flex; gap: 8px; margin-top: 14px; }
  .profile-hero__actions button { padding: 9px 18px; border-radius: 999px; border: none; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .btn-friend-primary { background: var(--accent); color: #fff; }
  .btn-friend-outline { background: var(--surface-fill); color: var(--ink); }
  .btn-friend-danger { background: none; color: var(--danger, #e33); border: 1px solid var(--border) !important; }
  .profile-more-menu { position: relative; }
  .profile-more-btn { background: var(--surface-fill); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .profile-more-list { position: absolute; top: 100%; right: 0; margin-top: 4px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); min-width: 160px; overflow: hidden; z-index: 10; display: none; }
  .profile-more-list.show { display: block; }
  .profile-more-list button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none; font-size: 12.5px; cursor: pointer; }
  .profile-more-list button:hover { background: var(--surface-fill); }

  .post-mini { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .post-mini__img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--surface-fill); }
  .post-mini__caption { font-size: 12.5px; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .post-mini__meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="app-topbar">
  <button class="app-topbar__back" onclick="history.back()">←</button>
  <div class="app-topbar__title">Hồ sơ</div>
  <div class="app-topbar__right"></div>
</header>

<main class="app-main">
  <div class="card">
    <div class="profile-hero">
      <div class="profile-hero__avatar" id="heroAvatar">--</div>
      <div class="profile-hero__name" id="heroName">Đang tải...</div>
      <div class="profile-hero__actions" id="heroActions"></div>
    </div>
  </div>

  <div class="card">
    <h3>📸 Bài đăng</h3>
    <div id="theirPostsList"><div class="empty-state">Đang tải...</div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="env.js"></script>
<script type="module" src="js/viewProfile.js"></script>
</body>
</html>
