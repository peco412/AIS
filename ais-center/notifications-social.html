<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Thông báo — AISCenter</title>
<link rel="stylesheet" href="css/parent.css" />
</head>
<body>

<header class="app-topbar">
  <button class="icon-btn" onclick="location.href='community.html'" title="Quay lại">←</button>
  <div class="app-topbar__title">Thông báo</div>
  <div class="app-topbar__right">
    <button class="icon-btn" id="btnMarkAllRead" title="Đánh dấu đã đọc hết">✓</button>
  </div>
</header>

<main class="app-main">
  <div id="notifList"><div class="skeleton-post"></div><div class="skeleton-post"></div></div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav__inner">
    <a href="home.html" class="nav-parent-only"><svg class="icon icon--nav" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>Trang chủ</a>
    <a href="community.html"><svg class="icon icon--nav" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>Cộng đồng</a>
    <a href="messages.html"><svg class="icon icon--nav" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5a8.5 8.5 0 1 1 17-3z"/></svg>Tin nhắn</a>
    <a href="wallet.html" class="nav-parent-only"><svg class="icon icon--nav" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Ví AIScoins</a>
    <a href="account.html" class="nav-parent-only"><svg class="icon icon--nav" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Tài khoản</a>
  </div>
</nav>

<style>
  .notif-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; cursor: pointer;
  }
  .notif-row.unread { background: var(--accent-tint, #e7f2f8); }
  .notif-row__avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent, #0d6ea6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; overflow: hidden; }
  .notif-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
  .notif-row__icon { position: absolute; margin-left: 28px; margin-top: 24px; font-size: 15px; background: #fff; border-radius: 50%; }
  .notif-row__text { flex: 1; font-size: 13.5px; line-height: 1.4; }
  .notif-row__text strong { font-weight: 700; }
  .notif-row__time { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="env.js"></script>
<script type="module" src="js/socialNotifications.js"></script>
</body>
</html>
